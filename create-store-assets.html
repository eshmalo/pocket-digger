<!DOCTYPE html>
<html>
<head>
    <title>Quick Store Assets Generator</title>
</head>
<body>
    <h1>Quick Store Assets for Pocket Digger</h1>
    
    <h2>App Icon (512x512)</h2>
    <canvas id="icon" width="512" height="512" style="border:1px solid black;"></canvas>
    <br><button onclick="downloadIcon()">Download Icon</button>
    
    <h2>Feature Graphic (1024x500)</h2>
    <canvas id="feature" width="1024" height="500" style="border:1px solid black;"></canvas>
    <br><button onclick="downloadFeature()">Download Feature Graphic</button>
    
    <script>
        // Draw Icon
        const iconCanvas = document.getElementById('icon');
        const iconCtx = iconCanvas.getContext('2d');
        
        // Gradient background
        const gradient = iconCtx.createLinearGradient(0, 0, 512, 512);
        gradient.addColorStop(0, '#8B7355');
        gradient.addColorStop(1, '#D2B48C');
        iconCtx.fillStyle = gradient;
        iconCtx.fillRect(0, 0, 512, 512);
        
        // Draw "PD" text
        iconCtx.fillStyle = '#FFFFFF';
        iconCtx.font = 'bold 200px Arial';
        iconCtx.textAlign = 'center';
        iconCtx.textBaseline = 'middle';
        iconCtx.fillText('PD', 256, 256);
        
        // Draw Feature Graphic
        const featureCanvas = document.getElementById('feature');
        const featureCtx = featureCanvas.getContext('2d');
        
        // Gradient background
        const featureGradient = featureCtx.createLinearGradient(0, 0, 1024, 500);
        featureGradient.addColorStop(0, '#8B7355');
        featureGradient.addColorStop(1, '#D2B48C');
        featureCtx.fillStyle = featureGradient;
        featureCtx.fillRect(0, 0, 1024, 500);
        
        // Title
        featureCtx.fillStyle = '#FFFFFF';
        featureCtx.font = 'bold 120px Arial';
        featureCtx.textAlign = 'center';
        featureCtx.textBaseline = 'middle';
        featureCtx.fillText('POCKET DIGGER', 512, 250);
        
        function downloadIcon() {
            const link = document.createElement('a');
            link.download = 'icon-512.png';
            link.href = iconCanvas.toDataURL();
            link.click();
        }
        
        function downloadFeature() {
            const link = document.createElement('a');
            link.download = 'feature-graphic.png';
            link.href = featureCanvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
