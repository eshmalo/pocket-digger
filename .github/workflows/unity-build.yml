name: Build‑Android (Pocket‑Digger)

on:
  push:
    branches: [prototype, main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1 – pull code
      - uses: actions/checkout@v4

      # 2 – cache Library folder (cuts build time ~50 %)
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android-${{ hashFiles('**/Assets/**', '**/ProjectSettings/**') }}
          restore-keys: Library-Android-

      # 3 – Activate Unity license
      - name: Activate Unity
        uses: game-ci/unity-activate@v2
        with:
          unityVersion: 2022.3.24f1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      # 4 – build with Game‑CI Unity Builder
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 2022.3.24f1     # Unity 2022 LTS
          targetPlatform: Android

      # 5 – Return license
      - name: Return license
        uses: game-ci/unity-return-license@v2
        if: always()

      # 6 – upload artifact for DeployGate
      - uses: actions/upload-artifact@v4
        with:
          name: PocketDigger‑apk
          path: build/Android/*.apk
      
      # 7 – Upload to DeployGate (optional)
      - name: Upload to DeployGate
        if: success() && github.event_name == 'push'
        run: |
          if [ -n "${{ secrets.DEPLOYGATE_API_TOKEN }}" ]; then
            bash deploy-to-deploygate.sh eshmalo
          fi
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}