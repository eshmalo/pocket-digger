name: Build‑Android (Pocket‑Digger)

on:
  push:
    branches: [prototype, main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1 – pull code
      - uses: actions/checkout@v4

      # 2 – cache Library folder (cuts build time ~50 %)
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android-${{ hashFiles('**/Assets/**', '**/ProjectSettings/**') }}
          restore-keys: Library-Android-

      # 3 – build with Game‑CI Unity Builder
      - name: Build Android APK
        uses: game-ci/unity-builder@v3
        with:
          unityVersion: 6000.1.13f1     # Unity 6 LTS
          targetPlatform: Android
        env:
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL:  ${{ secrets.UNITY_SERIAL }}

      # 4 – Return license
      - name: Return license
        uses: game-ci/unity-return-license@v2
        if: always()

      # 5 – upload artifact for DeployGate
      - uses: actions/upload-artifact@v4
        with:
          name: PocketDigger‑apk
          path: build/Android/*.apk