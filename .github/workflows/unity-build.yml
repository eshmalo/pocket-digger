name: Build‑Android (Pocket‑Digger)

on:
  push:
    branches: [prototype, main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1 – pull code
      - uses: actions/checkout@v4

      # 2 – cache Library folder (cuts build time ~50 %)
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android-${{ hashFiles('**/Assets/**', '**/ProjectSettings/**') }}
          restore-keys: Library-Android-

      # 3 – build with Game‑CI Unity Builder (Personal license)
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: 2022.3.21f1
          targetPlatform: Android
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # 4 – upload artifact
      - uses: actions/upload-artifact@v4
        with:
          name: PocketDigger‑apk
          path: build/Android/*.apk
      
      # 5 – Upload to DeployGate (optional)
      - name: Upload to DeployGate
        if: success() && github.event_name == 'push' && env.DEPLOYGATE_API_TOKEN != ''
        run: bash deploy-to-deploygate.sh eshmalo
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}